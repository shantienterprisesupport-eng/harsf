name: Agent Stack Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'praison/**'
      - 'mcp_server/**'
      - 'n8n/**'
      - 'package.json'
      - '.github/workflows/agents-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'praison/**'
      - 'mcp_server/**'
      - 'n8n/**'
      - 'package.json'
      - '.github/workflows/agents-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check gateway, routing and orchestration safety
        run: |
          node --check server/ai-gateway.mjs
          node --check server/provider-policy.mjs
          node --check server/provider-policy.selftest.mjs
          node --check scripts/security-self-test.mjs
          node --check scripts/ruflo-orchestrate.mjs
          node --check scripts/n8n-safe-handoff.mjs
          node --check scripts/n8n-import-workflow.mjs
          node server/provider-policy.selftest.mjs
          node scripts/security-self-test.mjs
          node scripts/ruflo-orchestrate.mjs --self-test
          node scripts/n8n-import-workflow.mjs --self-test
          node scripts/n8n-safe-handoff.mjs --self-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Ruflo CLI installs
        run: npx --yes ruflo@latest --version

      - name: Install PraisonAI and MCP
        run: python -m pip install praisonai "mcp>=2,<3"

      - name: Verify PraisonAI, MCP and six-agent files
        run: |
          python -c "import praisonaiagents; from mcp.server import MCPServer; print('PraisonAI + MCP import OK')"
          python -m py_compile praison/ai_company.py praison/run_handoff.py mcp_server/harsf_server.py
          python -m unittest mcp_server.test_harsf_server
          python - <<'PY'
          from pathlib import Path
          text = Path('praison/ai_company.py').read_text(encoding='utf-8')
          roles = [
              'Master Orchestrator Agent',
              'n8n Workflow Agent',
              'Coding and GitHub Agent',
              'Bug Fix and QA Agent',
              'Security Agent',
              'Deploy and Ops Agent',
          ]
          missing = [role for role in roles if role not in text]
          if missing:
              raise SystemExit(f'Missing roles: {missing}')
          print('Six agent roles OK')
          PY

      - name: Validate n8n workflow JSON
        run: python -m json.tool n8n/workflows/harsf-agent-intake.json > /dev/null

      - name: Validate n8n Docker Compose
        env:
          N8N_ENCRYPTION_KEY: ci-only-placeholder-not-used-for-runtime
        run: docker compose -f n8n/docker-compose.yml config > /dev/null

      - name: Existing HARSF QA
        run: |
          npm ci
          npm run qa
