name: Agent Stack Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'praison/**'
      - 'n8n/**'
      - 'MASTER-AI.cmd'
      - 'package.json'
      - '.github/workflows/agents-smoke.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'praison/**'
      - 'n8n/**'
      - 'MASTER-AI.cmd'
      - 'package.json'
      - '.github/workflows/agents-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Ruflo CLI installs
        run: npx --yes ruflo@latest --version

      - name: Install PraisonAI
        run: python -m pip install praisonai

      - name: Verify PraisonAI and Master AI files
        env:
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ci-placeholder-not-used-for-network
          ANTHROPIC_MODEL: claude-sonnet-5
        run: |
          python -c "import praisonaiagents; print('PraisonAI import OK')"
          python -m py_compile praison/ai_company.py
          python - <<'PY'
          from pathlib import Path
          from praison.ai_company import resolve_llm

          text = Path('praison/ai_company.py').read_text(encoding='utf-8')
          roles = [
              'Master Orchestrator Agent',
              'n8n Workflow Agent',
              'Coding and GitHub Agent',
              'Bug Fix and QA Agent',
              'Security Agent',
              'Deploy and Ops Agent',
          ]
          missing = [role for role in roles if role not in text]
          if missing:
              raise SystemExit(f'Missing roles: {missing}')
          if resolve_llm() != 'anthropic/claude-sonnet-5':
              raise SystemExit('Claude model routing failed')
          for required in ['MASTER-AI.cmd', 'scripts/run-master-ai.ps1']:
              if not Path(required).exists():
                  raise SystemExit(f'Missing Master AI launcher file: {required}')
          print('Master AI structure and Claude routing OK')
          PY

      - name: Validate n8n workflow JSON
        run: python -m json.tool n8n/workflows/harsf-agent-intake.json > /dev/null

      - name: Validate n8n Docker Compose
        env:
          N8N_ENCRYPTION_KEY: ci-only-placeholder-not-used-for-runtime
        run: docker compose -f n8n/docker-compose.yml config > /dev/null

      - name: Existing HARSF QA
        run: |
          npm ci
          npm run qa
