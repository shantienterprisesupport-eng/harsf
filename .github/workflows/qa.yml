name: HARSF QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'ai/**'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check background runtime syntax
        run: node --check runtime/api.mjs && node --check runtime/queue.mjs && node --check runtime/model.mjs && node --check runtime/worker.mjs && node --check runtime/start.mjs
      - name: Unit tests and production build
        run: npm run qa
